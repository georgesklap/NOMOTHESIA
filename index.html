<title>ΥΕΦΚΚ – Νομοθεσία σε ισχύ</title>
<style>
:root{
 --bg:#0d131c;--sf:#151d29;--sf2:#1b2533;--sf3:#222e3f;--line:#26324380;
 --tx:#e7ebf1;--tx2:#c9d1dc;--mut:#8e9aab;--acc:#8fb3f0;--navy:#13274a;--navy2:#1F3864;--navy3:#2a4d8a;
 --i:#8b96a5;--m:#e2a35f;--n:#69c38a;--d:#ec7a7a;--w:#bb96ec;--x:#6d7785;--f:#6fb6dd;--hl:#6b5a12;
 --fs:17px;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 var(--fs)/1.55 "Noto Sans",Roboto,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
a{color:var(--acc)}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
/* ---------- top bar */
header{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;box-shadow:0 1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:2px;min-height:44px}
.hb{display:flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;min-width:44px;height:44px;border-radius:22px;font:700 15px/1 inherit;cursor:pointer;padding:0 6px}
#fm,#fp{min-width:36px;padding:0 3px}
.ttl .t3{display:none}
body.inner .ttl{padding:0 4px;line-height:1.15}body.inner .ttl b{font-size:16px}body.inner .ttl .t2{display:none}
body.inner .ttl small.t3{display:block;font-size:12.5px;opacity:.8}
.hb:active{background:rgba(255,255,255,.14)}
.hb svg.i{width:24px;height:24px}
#back{display:none}
.ttl{flex:1;min-width:0;padding:0 6px;cursor:pointer}
.ttl b{display:block;font-size:16.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.inner .ttl small{display:none}
#sbtn{display:none}body.inner #sbtn{display:flex}
.sw{position:relative;margin:6px 4px 4px}
body.inner .sw{display:none}body.inner.searching .sw{display:block}
#q{width:100%;border:0;border-radius:12px;padding:11px 44px 11px 42px;font:16.5px/1.3 inherit;background:#f4f6fa;color:#101722;outline:none}
.sw .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#5b6576;width:20px;height:20px}
#clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:#5b6576;width:40px;height:40px;display:none;cursor:pointer;border-radius:20px}
main{max-width:860px;margin:0 auto;padding:12px 10px 0}
/* ---------- page headings */
.kick{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.8em;font-weight:600;margin:2px 2px 2px}
h2.pg{margin:2px 2px 4px;font-size:1.3em;line-height:1.3;font-weight:700;color:var(--tx)}
.lead{color:var(--mut);font-size:.88em;margin:0 2px 12px}
.sec{font-size:.74em;font-weight:700;color:var(--mut);letter-spacing:.06em;margin:20px 4px 8px;text-transform:uppercase}
/* ---------- home tiles (same layout as previous version) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tile{display:flex;flex-direction:column;gap:8px;background:var(--sf);border-radius:16px;padding:16px 14px 14px;text-decoration:none;color:var(--tx);min-height:126px;border:1px solid #ffffff0a}
.tile:active{background:var(--sf2)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--navy3);display:flex;align-items:center;justify-content:center;color:#fff}
.tile .ic svg.i{width:23px;height:23px}
.tile b{font-size:.98em;line-height:1.28;font-weight:700}
.tile .c{font-size:.76em;color:var(--mut);margin-top:auto}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;padding:12px 14px}
.tile.wide b{flex:1}.tile.wide .ic{width:36px;height:36px;background:var(--sf3)}
@media (min-width:640px){.tiles{grid-template-columns:1fr 1fr 1fr}}
/* ---------- lists */
.list{background:var(--sf);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 12px 13px 14px;text-decoration:none;color:var(--tx);border-bottom:1px solid var(--line);min-height:56px}
.li:last-child{border-bottom:0}.li:active{background:var(--sf2)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;line-height:1.32}
.li .tx small{display:block;color:var(--mut);font-size:.79em;line-height:1.38;margin-top:3px}
.li .ch{color:var(--mut);flex:none}
.li .num{flex:none;min-width:46px;text-align:center;font-size:.74em;font-weight:700;color:var(--acc);background:#8fb3f01a;border-radius:8px;padding:5px 4px;line-height:1.2}
/* ---------- provision = one distinct unit */
.prov{background:var(--sf);border-radius:var(--r);margin:0 0 10px;overflow:hidden}
.ph{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:12px 12px 10px 14px;cursor:pointer}
.ph .hx{flex:1;min-width:0}
.cite{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:.76em;line-height:1.3;margin-bottom:5px}
.cite .lw{font-weight:800;color:var(--acc);letter-spacing:.01em}
.cite .ar,.cite .pa{font-weight:700;color:var(--tx2)}
.cite .sep{color:var(--mut)}
.pt{font-size:1.04em;font-weight:700;line-height:1.32;color:var(--tx)}
.ph .tog{color:var(--mut);margin-top:2px;transition:transform .15s}
.prov.closed .ph .tog{transform:rotate(-90deg)}
.prov.closed .pb{display:none}
.prov.closed .ph{padding-bottom:12px}
.pb{padding:0 12px 12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7em;font-weight:700;letter-spacing:.02em;border-radius:20px;padding:2px 9px 2px 7px;line-height:1.5;white-space:nowrap}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.c-i{color:var(--i);background:#8b96a51f}.c-m{color:var(--m);background:#e2a35f1f}.c-n{color:var(--n);background:#69c38a1f}.c-d{color:var(--d);background:#ec7a7a1f}.c-w{color:var(--w);background:#bb96ec1f}.c-x{color:var(--x);background:#6d77852b}.c-f{color:var(--f);background:#6fb6dd1f}.c-s{color:#c9b07a;background:#c9b07a1c}
/* legal text */
.it{margin:0;padding:10px 0 0 12px;border-left:3px solid #8b96a540}
.it+.it{margin-top:12px}
.it.s-m{border-left-color:var(--m)}.it.s-n{border-left-color:var(--n)}.it.s-d{border-left-color:var(--d)}.it.s-w{border-left-color:var(--w)}.it.s-x{border-left-color:#6d778566}
.it.sum{border-left-style:dashed}
.lx p{margin:0 0 .55em;color:var(--tx);overflow-wrap:anywhere}
.lx p:last-child{margin-bottom:0}
.lx p.sub{padding-left:1.25em;text-indent:-1.25em}
.lx p.sub2{padding-left:2.25em;text-indent:-1.25em}
.lx p.dash{padding-left:1em;text-indent:-1em}
.lx p.hd{font-weight:700;color:var(--acc);margin-top:.9em;letter-spacing:.01em}
.lx p.hd:first-child{margin-top:0}
.lx b.pn{font-weight:800;color:var(--tx)}
.it.s-d .lx p{color:var(--mut);text-decoration:line-through;text-decoration-color:#ec7a7a99}
.it.s-x .lx p,.it.sum .lx p{color:var(--tx2);font-style:italic}
.it.s-d.sum .lx p{font-style:normal;color:var(--mut)}
.it.s-d.sum .sumlbl{color:var(--d)}
.lx p.dim{color:var(--mut)}
.sumlbl{font-size:.7em;font-weight:700;color:#c9b07a;letter-spacing:.03em;margin:0 0 4px;text-transform:uppercase}
.mod{display:flex;gap:6px;align-items:flex-start;font-size:.76em;line-height:1.4;color:var(--mut);margin:7px 0 0}
.mod .d{width:7px;height:7px;border-radius:50%;flex:none;margin-top:.45em}
.mod b{font-weight:700}
.mod.s-i b{color:var(--i)}.mod.s-m b{color:var(--m)}.mod.s-n b{color:var(--n)}.mod.s-d b{color:var(--d)}.mod.s-w b{color:var(--w)}.mod.s-x b{color:var(--x)}
.mod.s-w{color:var(--tx2)}
.d.s-i{background:var(--i)}.d.s-m{background:var(--m)}.d.s-n{background:var(--n)}.d.s-d{background:var(--d)}.d.s-w{background:var(--w)}.d.s-x{background:var(--x)}
/* visible validity warning */
.warn{display:flex;gap:8px;align-items:flex-start;background:#6fb6dd14;color:var(--tx2);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:.82em;line-height:1.45}
.warn svg.i{color:var(--f);margin-top:.1em}
.warn.w{background:#bb96ec14}.warn.w svg.i{color:var(--w)}
/* explanatory notes: collapsible */
details.nt{background:var(--sf2);border-radius:10px;margin:0 0 10px;font-size:.88em;line-height:1.5}
details.nt>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;color:var(--tx2);font-weight:600;min-height:44px}
details.nt>summary::-webkit-details-marker{display:none}
details.nt>summary .lb{font-size:.78em;font-weight:800;letter-spacing:.05em;color:var(--mut);text-transform:uppercase;flex:none}
details.nt>summary .st{flex:1;min-width:0}
details.nt>summary .tog{color:var(--mut);transition:transform .15s}
details.nt[open]>summary .tog{transform:rotate(90deg)}
details.nt .nb{padding:0 12px 12px;color:var(--tx2)}
details.nt .nb p{margin:.35em 0}details.nt .nb ul{margin:.3em 0;padding-left:1.2em}details.nt .nb li{margin-bottom:.35em}
/* action buttons */
.acts{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 6px;border-radius:10px;background:var(--sf3);color:var(--tx);text-decoration:none;font-size:.78em;font-weight:700;line-height:1.2;text-align:center;border:0;font-family:inherit}
.btn:active{background:var(--navy3)}
.btn svg.i{width:18px;height:18px;color:var(--acc)}
.btn.pri{background:var(--navy3);color:#fff}.btn.pri svg.i{color:#fff}
.tools{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;font-size:.8em;color:var(--mut)}
.tools button{background:none;border:0;color:var(--acc);font:700 1em inherit;padding:8px 2px;min-height:40px;cursor:pointer}
/* tables */
.tw{overflow-x:auto;margin:2px 0;-webkit-overflow-scrolling:touch}
.tcap{font-weight:700;font-size:.86em;margin:2px 0 6px;color:var(--acc)}
table{border-collapse:collapse;font-size:.8em;min-width:100%}
th{background:var(--navy2);color:#fff;text-align:left;padding:7px 8px;font-weight:700}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;color:var(--tx)}
tr:nth-child(odd) td{background:#ffffff05}
td.lb{font-weight:700;width:32%}
mark{background:var(--hl);color:#fff;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.meta{color:var(--mut);font-size:.82em;margin:2px 4px 10px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.nav a{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--sf);border-radius:10px;min-height:48px;padding:8px;text-decoration:none;font-weight:700;font-size:.84em;color:var(--tx)}
.nav a svg.i{color:var(--acc)}
.foot{color:var(--mut);font-size:.74em;text-align:center;margin:22px 0 6px;line-height:1.5}
.card{background:var(--sf);border-radius:var(--r);padding:14px;margin:0 0 10px;font-size:.94em}
.card h3{margin:0 0 6px;font-size:1em}.card ul{padding-left:1.2em;margin:.4em 0}.card li{margin-bottom:.35em}.card p{margin:.4em 0}
</style>
</head>
<body>
<header>
 <div class="bar">
  <button class="hb" id="back" aria-label="Πίσω"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="ttl" id="home"><b><span class="t1">ΥΕΦΚΚ</span><span class="t2"> – Νομοθεσία σε ισχύ</span></b><small>Εξωτερική Φρούρηση · Σωφρονιστικό σύστημα</small><small class="t3">Νομοθεσία σε ισχύ</small></div>
  <button class="hb" id="sbtn" aria-label="Αναζήτηση"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  <button class="hb" id="fm" aria-label="Μικρότερα γράμματα">A−</button><button class="hb" id="fp" aria-label="Μεγαλύτερα γράμματα">A+</button>
 </div>
 <div class="sw"><svg class="i si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Αναζήτηση: λέξη, θέμα, νόμος ή άρθρο" autocomplete="off" autocorrect="off" spellcheck="false"><button id="clr" aria-label="Καθαρισμός"><svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
</header>
<main id="m"></main>
<script src="data.js"></script>
<script src="topics.js"></script>
<script>
'use strict';
const D=window.LAWDATA,T=window.TOPICS;const PDF_BASE=window.PDF_BASE||'pdf/';
/* ---------- icons (inline SVG) */
const P={
 shield:'<path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/>',
 euro:'<path d="M17.5 6.5A7 7 0 1 0 17.5 17.5"/><path d="M4 10h9M4 14h9"/>',
 swap:'<path d="M4 7h14l-4-4"/><path d="M20 17H6l4 4"/>',
 clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6M9 18h3"/>',
 bank:'<path d="M3 21h18"/><path d="M5 21V11M9.5 21V11M14.5 21V11M19 21V11"/><path d="M2.5 10L12 4l9.5 6z"/>',
 spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
 books:'<path d="M4 19V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v14"/><path d="M4 19h5"/><path d="M9 19V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v12"/><path d="M9 19h5"/><path d="M14.5 6.8l2.9-.8a1 1 0 0 1 1.2.7l2.9 11.6-3.9 1-3.1-12.5"/>',
 pdf:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/>',
 art:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 12h6M9 16h6"/>',
 tree:'<path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
 chevR:'<path d="M9 6l6 6-6 6"/>',chevL:'<path d="M15 6l-6 6 6 6"/>',chevD:'<path d="M6 9l6 6 6-6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.2"/>',
 note:'<path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4"/><path d="M8.5 9h7M8.5 12.5h5"/>',
 dl:'<path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/>',open:'<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'};
const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const CATICON={service:'shield',pay:'euro',moves:'swap',duties:'clip',prison:'bank',changes:'spark'};

/* ---------- text helpers */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Συντομογραφία της Υπηρεσίας στο περιβάλλον της εφαρμογής (όχι στα νομικά κείμενα, που δεν την περιέχουν).
const ab=s=>String(s==null?'':s).replace(/ΥΕΦ(?![ΚΑ-Ωα-ωΆ-Ώά-ώ])/g,'ΥΕΦΚΚ');
function nc(ch){const n=ch.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();let c=(n||ch)[0];if(c==='ς')c='σ';if(c==='’'||c==='΄'||c==="'"||c==='`')c="'";return c}
function norm(s){let o='';for(const ch of String(s))o+=nc(ch);return o}
let terms=[];
function hl(t){t=String(t);if(!terms.length)return esc(t);if([...t].length!==t.length)return esc(t);
 const n=norm(t);const mk=new Uint8Array(t.length);
 for(const w of terms){let i=0;while((i=n.indexOf(w,i))>-1){mk.fill(1,i,i+w.length);i+=w.length}}
 let o='',on=0;for(let i=0;i<t.length;i++){if(mk[i]&&!on){o+='<mark>';on=1}if(!mk[i]&&on){o+='</mark>';on=0}o+=esc(t[i])}if(on)o+='</mark>';return o}
const ha=s=>hl(ab(s)); // UI text: abbreviation + highlight

/* ---------- index of data */
const STN={i:'Ισχύει',m:'Τροποποιήθηκε',n:'Νέο',d:'Καταργήθηκε',w:'Προσοχή',x:'Δεν αφορά ΥΕΦΚΚ'};
const DOC={},ART={};D.docs.forEach(d=>{DOC[d.id]=d;d.arts.forEach(a=>{ART[a.id]={a,d}})});
const LAWNAME={n2721:'ν. 2721/1999',pd215:'π.δ. 215/2006',n5246:'ν. 5246/2025',bill:'Νομοσχέδιο',sk:'Σωφρονιστικός Κώδικας'};
const LAWRX=/^(ν\.δ?\.? ?[\d/]+|ν\. [\d/]+|Ποινικός Κώδικας|νσ\.)/;
function lawOf(d,a){if(LAWNAME[d.id])return LAWNAME[d.id];const m=a.t.match(LAWRX);if(m)return m[1]==='νσ.'?'Νομοσχέδιο':m[1];return d.law}
function titleOf(a){return a.t.replace(new RegExp(LAWRX.source+'\\s*–\\s*'),'')}
function artLbl(a){if(/^Μέρος/.test(a.n))return a.n+' (τίτλος)';if(/–/.test(a.n))return 'Άρθρα '+a.n;return 'Άρθρο '+a.n}
function parLbl(it){if(it.T)return 'πίνακας';const f=it.L[0];let m;
 if((m=f.match(/^(\d{1,2}[Α-Ω]?)\.(?!\d)/)))return 'παρ. '+m[1];if((m=f.match(/^([α-ω]{1,3})\)/)))return 'περ. '+m[1];return ''}
// μη αυτούσιο κείμενο (περιλήψεις/ενδείξεις που υπάρχουν ήδη στα δεδομένα)
function isSummary(it){if(it.T)return /ΔΙΚΟΣ ΜΑΣ ΥΠΟΛΟΓΙΣΜΟΣ/.test(it.c||'');const l=it.L;
 if(/περίληψη/.test(it.c||''))return true;
 if(l.length===1&&(/\[Καταργήθηκε\]$/.test(l[0])||/^(\S+\s)?\(.*\)\.?$/.test(l[0])))return true;

 res.sort((a,b)=>sc(b)-sc(a));
 let o='';
 if(tps.length)o+=`<div class="sec" style="margin-top:2px">Θέματα</div><div class="list">`+tps.map(({c,t})=>`<a class="li" href="#t/${c.id}/${t.id}"><span class="tx"><b>${ha(t.t)}</b><small>${esc(ab(c.t))}</small></span><span class="ch">${ico('chevR')}</span></a>`).join('')+'</div>';
 if(!res.length&&!tps.length){m.innerHTML='<div class="empty">Δεν βρέθηκε κάτι.<br>Δοκίμασε άλλη λέξη, λιγότερες λέξεις ή κομμάτι λέξης.</div>';return}
 o+=`<div class="sec">Διατάξεις – ${res.length}${any?' (με οποιαδήποτε λέξη)':''}</div>`;
 o+=res.slice(0,60).map(e=>{
  if(e.type==='g')return guideCard(e.c,e.g.t,false);
  const {d,a,it,k}=e;const lines=new Map();
  if(!it.T&&it.L.length>4){const keep=new Set();it.L.forEach((l,i)=>{const n=norm(l);if(terms.some(w=>n.includes(w)))keep.add(i)});
   if(keep.size&&keep.size<it.L.length){keep.add(0);const ls=[];let last=-1;[...keep].sort((x,y)=>x-y).forEach(i=>{if(last>=0&&i>last+1)ls.push({h:'<p class="dim">…</p>'});ls.push(it.L[i]);last=i});if(last<it.L.length-1)ls.push({h:'<p class="dim">…</p>'});lines.set(it,ls)}}
  return provCard(d,a,[k],{lines,search:true})}).join('');
 if(res.length>60)o+='<div class="meta">Εμφανίζονται οι 60 πιο σχετικές – πρόσθεσε λέξη για πιο στοχευμένα αποτελέσματα.</div>';
 m.innerHTML=o}

/* ---------- interactions */
m.addEventListener('click',e=>{
 const ph=e.target.closest('.ph');if(ph){const s=ph.parentElement;s.classList.toggle('closed');ph.setAttribute('aria-expanded',!s.classList.contains('closed'));return}
 const all=e.target.closest('[data-all]');if(all){const open=all.dataset.all==='open';m.querySelectorAll('.prov').forEach(s=>{s.classList.toggle('closed',!open);s.querySelector('.ph').setAttribute('aria-expanded',open)});return}
 const a=e.target.closest('a[href^="#"]');if(a&&q.value){q.value='';document.body.classList.remove('searching');if(location.hash===a.getAttribute('href')){e.preventDefault();render();window.scrollTo(0,0)}}});
function parent(h){let x;if((x=h.match(/^t\/([^/]+)\//)))return '#c/'+x[1];if(/^a\//.test(h))return '#d/'+(ART[h.slice(2)]?ART[h.slice(2)].d.id:'');if(/^d\//.test(h))return '#laws';return '#'}
let depth=0;
function render(){const v=q.value.trim();clr.style.display=v?'flex':'none';terms=norm(v).split(/\s+/).filter(Boolean);
 const h=decodeURIComponent(location.hash.slice(1));const inner=!!(h||terms.length);
 back.style.display=inner?'flex':'none';document.body.classList.toggle('inner',inner);if(terms.length)document.body.classList.add('searching');
 if(terms.length){search();return}
 let x;
 if((x=h.match(/^c\/(.+)$/))&&T.find(c=>c.id===x[1]))catView(T.find(c=>c.id===x[1]));
 else if((x=h.match(/^t\/(.+)$/))&&TOPIC[x[1]])topicView(TOPIC[x[1]].c,TOPIC[x[1]].t);
 else if(h==='laws')lawsView();
 else if((x=h.match(/^d\/(.+)$/))&&DOC[x[1]])docView(DOC[x[1]]);
 else if((x=h.match(/^a\/(.+)$/))&&ART[x[1]])artView(ART[x[1]]);
 else if((x=h.match(/^g\/(\d+)$/))&&D.guide[+x[1]])guideView(+x[1]);
 else if(h==='pdf')pdfView();else if(h==='about')aboutView();else home()}
back.onclick=()=>{if(q.value||document.body.classList.contains('searching')){q.value='';document.body.classList.remove('searching');render();return}
 if(depth>0)history.back();else location.hash=parent(decodeURIComponent(location.hash.slice(1)))};
document.getElementById('sbtn').onclick=()=>{document.body.classList.add('searching');q.focus()};
let tmr;q.addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(()=>{render();window.scrollTo(0,0)},160)});
q.addEventListener('keydown',e=>{if(e.key==='Enter')q.blur()});
clr.onclick=()=>{q.value='';render();q.focus()};
document.getElementById('home').onclick=()=>{q.value='';document.body.classList.remove('searching');if(location.hash&&location.hash!=='#')location.hash='';else render()};
window.addEventListener('hashchange',()=>{depth++;if(!q.value)document.body.classList.remove('searching');render();window.scrollTo(0,0)});
window.addEventListener('popstate',()=>{depth=Math.max(0,depth-2)});
let fs=17;try{fs=+localStorage.getItem('yefkk_fs')||17}catch(e){}
function setFs(v){fs=Math.max(14,Math.min(24,v));document.documentElement.style.setProperty('--fs',fs+'px');try{localStorage.setItem('yefkk_fs',fs)}catch(e){}}
setFs(fs);document.getElementById('fm').onclick=()=>setFs(fs-1);document.getElementById('fp').onclick=()=>setFs(fs+1);
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!window.NO_SW){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
